    // ==================== Wantlist item → ResultCard props ====================
    function itemToResult(item) {
      const info = item.basic_information;
      return {
        id: info.id,
        title: (info.artists || []).map(a => a.name).join(', ') + ' \u2014 ' + info.title,
        cover_image: info.cover_image,
        catno: (info.labels || []).map(l => l.catno).filter(c => c && c !== 'none')[0] || '',
        label: (info.labels || []).map(l => l.name),
        format: (info.formats || []).flatMap(f => [f.name, ...(f.descriptions || [])]).filter(Boolean),
        year: info.year > 0 ? String(info.year) : '',
        country: '',
        uri: '/release/' + info.id,
      };
    }

    const LIST_PAGE_SIZE = 20;

    // ==================== Main App ====================
    function App() {
      const saved = loadSettings();
      const prefs = loadPrefs(saved.username || '');
      const [token, setToken] = useState(saved.token || '');
      const [username, setUsername] = useState(saved.username || '');
      const [connected, setConnected] = useState(false);
      const [collectionRaw, setCollectionRaw] = useState([]);
      const [collectionIds, setCollectionIds] = useState(new Set());
      const [collLoading, setCollLoading] = useState(false);
      const [loadProg, setLoadProg] = useState('');
      const [settingsOpen, setSettingsOpen] = useState(true);
      const [folders, setFolders] = useState([]);
      const [fields, setFields] = useState([]);
      const [cacheInfo, setCacheInfo] = useState(null);
      const [personalFields, setPersonalFields] = useState({});  // { [releaseId]: { price, notes, tags, ... } }
      const [wantlistIds, setWantlistIds] = useState(new Set());
      const [wantlistRaw, setWantlistRaw] = useState([]);
      const [activeView, setActiveView] = useState('search');

      const [query, setQuery] = useState('');
      const [searchType, setSearchType] = useState('catno');
      const [exactCatno, setExactCatno] = useState(false);

      const [filterFormats, setFilterFormats] = useState([]);
      const [filterSizes, setFilterSizes] = useState([]);
      const [filterYears, setFilterYears] = useState([]);
      const [filterCountries, setFilterCountries] = useState([]);
      const [filterLabels, setFilterLabels] = useState([]);

      // API results from Discogs search
      const [apiResults, setApiResults] = useState([]);
      // Local collection matches
      const [localResults, setLocalResults] = useState([]);
      const [searching, setSearching] = useState(false);
      const [hasSearched, setHasSearched] = useState(false);
      const [error, setError] = useState('');
      const [pagination, setPagination] = useState(null);
      const [page, setPage] = useState(1);
      const [availableFilters, setAvailableFilters] = useState({ years: [], countries: [], formats: [], labels: [] });
      const searchGen = useRef(0);
      const [showAllImages, setShowAllImages] = useState(false);
      const [expandedThumbId, setExpandedThumbId] = useState(null);
      const [releaseImages, setReleaseImages] = useState({});
      const [imagesLoading, setImagesLoading] = useState(false);
      const [imagesProgress, setImagesProgress] = useState('');
      const imagesAbort = useRef(false);
      const [hoverPreview, setHoverPreview] = useState(null);
      const previewRef = useRef(null);
      const [showToTop, setShowToTop] = useState(false);
      const [showChanges, setShowChanges] = useState(false);
      const [changesHtml, setChangesHtml] = useState(null);
      const [theme, setTheme] = useState(() => {
        try { return document.documentElement.getAttribute('data-theme') || 'light'; }
        catch(e) { return 'light'; }
      });
      const [filtersVisible, setFiltersVisible] = useState(() => {
        try { return localStorage.getItem('runout_filters_visible') !== '0'; }
        catch(e) { return true; }
      });
      const [collSidebarHidden, setCollSidebarHidden] = useState(() => {
        try { return localStorage.getItem('runout_coll_sidebar_hidden') === '1'; }
        catch(e) { return false; }
      });
      // Per-search-session dismissed result IDs. Cleared on every new search.
      const [dismissedIds, setDismissedIds] = useState(() => new Set());

      // Persist theme + sync DOM and mobile status-bar color.
      useEffect(() => {
        try {
          document.documentElement.setAttribute('data-theme', theme);
          localStorage.setItem('runout_theme', theme);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#1e1b4b' : '#4f46e5');
        } catch(e) {}
      }, [theme]);

      useEffect(() => {
        try { localStorage.setItem('runout_filters_visible', filtersVisible ? '1' : '0'); } catch(e) {}
      }, [filtersVisible]);

      useEffect(() => {
        try { localStorage.setItem('runout_coll_sidebar_hidden', collSidebarHidden ? '1' : '0'); } catch(e) {}
      }, [collSidebarHidden]);

      // Show changes popup when the installed version differs from the last seen one.
      // First-time visitors don't see it; they just get their current version saved.
      useEffect(() => {
        const seen = localStorage.getItem('runout_seen_version');
        if (seen && seen !== APP_VERSION) setShowChanges(true);
        localStorage.setItem('runout_seen_version', APP_VERSION);
      }, []);

      // Also allow opening via #changes hash (footer link)
      useEffect(() => {
        const openIfHash = () => {
          if (window.location.hash === '#changes') {
            setShowChanges(true);
            history.replaceState(null, '', window.location.pathname + window.location.search);
          }
        };
        window.addEventListener('hashchange', openIfHash);
        openIfHash();
        return () => window.removeEventListener('hashchange', openIfHash);
      }, []);

      // Lazy-load changes.html when modal opens for the first time
      useEffect(() => {
        if (!showChanges || changesHtml !== null) return;
        fetch('./changes.html', { cache: 'no-store' })
          .then(r => r.ok ? r.text() : '<p>Could not load changelog.</p>')
          .then(setChangesHtml)
          .catch(() => setChangesHtml('<p>Could not load changelog.</p>'));
      }, [showChanges, changesHtml]);

      useEffect(() => {
        const isDesktop = window.matchMedia('(min-width: 960px)').matches;
        const target = isDesktop ? mainRef.current : window;
        if (!target) return;
        const getScroll = () => isDesktop ? (mainRef.current ? mainRef.current.scrollTop : 0) : window.scrollY;
        const check = () => setShowToTop(getScroll() > window.innerHeight * 0.8);
        target.addEventListener('scroll', check, { passive: true });
        check();
        return () => target.removeEventListener('scroll', check);
      }, [activeView]);

      const scrollToTop = () => {
        const isDesktop = window.matchMedia('(min-width: 960px)').matches;
        if (isDesktop && mainRef.current) mainRef.current.scrollTo({ top: 0, behavior: 'smooth' });
        else window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const movePreview = (e) => {
        if (!previewRef.current) return;
        const offset = 24;
        const W = 420, H = 420;
        let x = e.clientX + offset;
        let y = e.clientY + offset;
        if (x + W > window.innerWidth) x = e.clientX - offset - W;
        if (y + H > window.innerHeight) y = e.clientY - offset - H;
        previewRef.current.style.left = `${Math.max(8, x)}px`;
        previewRef.current.style.top = `${Math.max(8, y)}px`;
      };

      // Collection/Wantlist filters
      const [collFilter, setCollFilter] = useState({ formats: [], sizes: [], years: [], labels: [], folders: [] });
      const [wantFilter, setWantFilter] = useState({ formats: [], sizes: [], years: [], labels: [] });
      const [collSearch, setCollSearch] = useState('');
      const [collSort, setCollSort] = useState('artist_title');
      const [collLayout, setCollLayout] = useState('list');
      const [modalItem, setModalItem] = useState(null);
      const [modalDetails, setModalDetails] = useState(null);
      const [modalLoading, setModalLoading] = useState(false);

      useEffect(() => {
        if (!modalItem) return;
        setModalDetails(null);
        setModalLoading(true);
        let cancelled = false;
        dGet(`/releases/${modalItem.basic_information.id}`, token)
          .then(d => { if (!cancelled) setModalDetails(d); })
          .catch(() => { if (!cancelled) setModalDetails({ tracklist: [] }); })
          .finally(() => { if (!cancelled) setModalLoading(false); });
        const onKey = (e) => { if (e.key === 'Escape') setModalItem(null); };
        document.addEventListener('keydown', onKey);
        return () => { cancelled = true; document.removeEventListener('keydown', onKey); };
      }, [modalItem]);
      const [collShown, setCollShown] = useState(40);
      const [wantShown, setWantShown] = useState(40);
      const mainRef = useRef(null);
      const collSentinelRef = useRef(null);
      const wantSentinelRef = useRef(null);

      const BATCH_LIST = 40;
      const BATCH_GRID = 80;

      // Track filter keys so we can reset infinite scroll synchronously at render time
      // (useEffect resets after render, which would briefly render the old slice count).
      const collKey = `${activeView}|${collLayout}|${collSearch}|${collSort}|${JSON.stringify(collFilter)}`;
      const wantKey = `${activeView}|${JSON.stringify(wantFilter)}`;
      const prevCollKeyRef = useRef(collKey);
      const prevWantKeyRef = useRef(wantKey);
      const collReset = collLayout === 'grid' ? BATCH_GRID : BATCH_LIST;
      const effectiveCollShown = prevCollKeyRef.current === collKey ? collShown : collReset;
      const effectiveWantShown = prevWantKeyRef.current === wantKey ? wantShown : BATCH_LIST;

      useEffect(() => {
        if (prevCollKeyRef.current === collKey) return;
        prevCollKeyRef.current = collKey;
        setCollShown(collReset);
        if (mainRef.current) mainRef.current.scrollTop = 0;
      }, [collKey]);

      useEffect(() => {
        if (prevWantKeyRef.current === wantKey) return;
        prevWantKeyRef.current = wantKey;
        setWantShown(BATCH_LIST);
      }, [wantKey]);

      // Infinite scroll observer for Collection
      useEffect(() => {
        if (activeView !== 'collection' || !collSentinelRef.current) return;
        const isDesktop = window.matchMedia('(min-width: 960px)').matches;
        const root = isDesktop ? mainRef.current : null;
        const step = collLayout === 'grid' ? BATCH_GRID : BATCH_LIST;
        const obs = new IntersectionObserver((entries) => {
          if (entries[0].isIntersecting) setCollShown(c => c + step);
        }, { root, rootMargin: '400px' });
        obs.observe(collSentinelRef.current);
        return () => obs.disconnect();
      }, [activeView, collLayout, collShown]);

      // Infinite scroll observer for Wantlist
      useEffect(() => {
        if (activeView !== 'wantlist' || !wantSentinelRef.current) return;
        const isDesktop = window.matchMedia('(min-width: 960px)').matches;
        const root = isDesktop ? mainRef.current : null;
        const obs = new IntersectionObserver((entries) => {
          if (entries[0].isIntersecting) setWantShown(c => c + BATCH_LIST);
        }, { root, rootMargin: '400px' });
        obs.observe(wantSentinelRef.current);
        return () => obs.disconnect();
      }, [activeView, wantShown]);

      const [lastFolder, setLastFolder] = useState(prefs.lastFolder || '1');
      const [lastMedia, setLastMedia] = useState(prefs.lastMedia || '');

      // Auto-connect
      useEffect(() => {
        if (saved.token && !connected && !collLoading) {
          handleConnect(saved.token, saved.username);
        }
      }, []);

      const handleConnect = async (t, u, forceRefresh) => {
        const tk = t || token;
        if (!tk) return;
        setCollLoading(true); setLoadProg('');
        try {
          let un = u || username;
          if (!un) {
            setLoadProg('Fetching account...');
            const ident = await fetchIdentity(tk);
            un = ident.username;
            setUsername(un);
          }
          let items;
          const cached = !forceRefresh && loadCachedCollection(un);
          if (cached && cached.items) {
            items = cached.items;
            setCacheInfo({ count: cached.count, ts: cached.ts });
            setLoadProg(`${cached.count} (cached)`);
          } else {
            setLoadProg('0/?');
            items = await loadCollectionFromAPI(un, tk, (n, tot) => setLoadProg(`${n}/${tot}`));
            saveCachedCollection(items, un);
            setCacheInfo({ count: items.length, ts: Date.now() });
          }
          setCollectionRaw(items);
          setCollectionIds(new Set(items.map(i => i.id)));
          const [uf, ufi] = await Promise.all([loadFolders(un, tk), loadFields(un, tk)]);
          setFolders(uf.length > 0 ? uf : [{ id: 1, name: 'Uncategorized', count: 0 }]);
          setFields(ufi);
          // Load wantlist
          const cachedWants = !forceRefresh && loadCachedWantlist(un);
          let wantItems;
          if (cachedWants && cachedWants.items) {
            wantItems = cachedWants.items;
          } else {
            wantItems = await loadWantlistFromAPI(un, tk);
            saveCachedWantlist(wantItems, un);
          }
          setWantlistRaw(wantItems);
          setWantlistIds(new Set(wantItems.map(w => w.id)));
          // Personal fields (optional backend feature)
          if (BACKEND_API) {
            try {
              const fields = await backendGet('/api/fields', tk);
              if (fields) setPersonalFields(fields);
            } catch (e) { console.warn('Personal fields unavailable:', e.message); }
          }
          setConnected(true);
          setSettingsOpen(false);
          saveSettings(tk, un);
        } catch (e) { alert('Could not connect:' + e.message); }
        setCollLoading(false);
      };

      const handleRefresh = () => handleConnect(token, username, true);

      const handleDisconnect = () => {
        setConnected(false); setCollectionRaw([]); setCollectionIds(new Set());
        setWantlistIds(new Set()); setWantlistRaw([]);
        setFolders([]); setFields([]); setToken(''); setUsername('');
        setCacheInfo(null); setPersonalFields({}); clearActiveSession(); setSettingsOpen(true);
        // Reset search state to prevent stale data on reconnect
        setApiResults([]); setLocalResults([]); setHasSearched(false);
        setSearching(false); setError(''); setPagination(null); setPage(1);
        setAvailableFilters({ years: [], countries: [], formats: [], labels: [] });
        searchGen.current++;
      };

      const handleDeleteAccount = () => {
        if (!confirm(`Delete all cached data for "${username}"?`)) return;
        removeAccount(username);
        handleDisconnect();
      };

      const handleSwitchAccount = (acct) => {
        setToken(acct.token);
        setUsername(acct.username);
      };

      const accounts = loadAccounts();

      const handlePrefsUpdate = (p) => {
        if (p.lastFolder) setLastFolder(p.lastFolder);
        if (p.lastMedia) setLastMedia(p.lastMedia);
        savePrefs({ ...loadPrefs(username), ...p }, username);
      };

      // ==================== Unified search ====================
      const doSearch = async (p = 1, extraFilters = {}, overrideQuery, overrideType) => {
        const q = overrideQuery !== undefined ? overrideQuery : query;
        const st = overrideType !== undefined ? overrideType : searchType;
        if (!q.trim() || !token) return;
        const gen = ++searchGen.current;
        setSearching(true); setError(''); setHasSearched(true);
        setExpandedThumbId(null); setReleaseImages({}); setShowAllImages(false);
        imagesAbort.current = true;

        // 1. Local search (instant)
        const local = searchLocal(collectionRaw, q, st);
        setLocalResults(local);

        // 2. API search
        try {
          const params = { type: 'release', page: p, per_page: 20 };
          if (st === 'catno') params.catno = q.trim();
          else if (st === 'barcode') params.barcode = q.trim();
          else params.q = q.trim();

          const ff = extraFilters.formats !== undefined ? extraFilters.formats : filterFormats;
          const fs = extraFilters.sizes !== undefined ? extraFilters.sizes : filterSizes;
          const fy = extraFilters.years !== undefined ? extraFilters.years : filterYears;
          const fc = extraFilters.countries !== undefined ? extraFilters.countries : filterCountries;
          // API only accepts one value per filter; send only when exactly one selected.
          // Multi-select falls back to client-side filtering below.
          if (ff.length === 1) params.format = ff[0];
          if (fy.length === 1) params.year = fy[0];
          if (fc.length === 1) params.country = fc[0];

          const d = await dGet('/database/search', token, params);
          if (gen !== searchGen.current) return; // stale search, discard
          let res = d.results || [];

          // Client-side size filter: keep matches + items without any size specified
          if (fs.length > 0) {
            const sizes = ['12"', '7"', '10"'];
            res = res.filter(r => {
              const fmts = r.format || [];
              const hasAnySize = fmts.some(f => sizes.some(s => f.includes(s)));
              if (!hasAnySize) return true; // no size info → always show
              return fmts.some(f => fs.some(s => f.includes(s))); // has size → must match any selected
            });
          }

          // For catno/barcode searches: expand all versions from master releases
          const expandVersions = (st === 'catno' || st === 'barcode');
          const masterIds = expandVersions ? [...new Set(res.filter(r => r.master_id).map(r => r.master_id))] : [];
          let allVersions = [];
          if (masterIds.length > 0) {
            const versionResults = await Promise.all(
              masterIds.map(async mid => {
                try {
                  const pages = [];
                  let vp = 1;
                  while (vp <= 5) { // cap at 500 versions per master
                    const vd = await dGet(`/masters/${mid}/versions`, token, { per_page: 100, page: vp });
                    pages.push(...(vd.versions || []));
                    if (vp >= (vd.pagination?.pages || 1)) break;
                    vp++;
                  }
                  return pages;
                } catch (e) { return []; }
              })
            );
            allVersions = versionResults.flat();
          }
          if (gen !== searchGen.current) return; // stale after version expansion

          // Convert versions to ResultCard-compatible shape, keyed by release id
          const searchById = {};
          res.forEach(r => { searchById[r.id] = r; });

          const versionResults = allVersions.map(v => {
            // If we already have this from search results, prefer that (richer data)
            if (searchById[v.id]) return searchById[v.id];
            return {
              id: v.id,
              title: v.title || '',
              cover_image: v.thumb || '',
              catno: v.catno || '',
              label: v.label ? [v.label] : [],
              format: v.format ? v.format.split(', ') : [],
              year: v.released || '',
              country: v.country || '',
              uri: '/release/' + v.id,
              master_id: null, // prevent nested version fetches
            };
          });

          // Merge: search results + versions, deduplicated by id
          const merged = {};
          res.forEach(r => { merged[r.id] = r; });
          versionResults.forEach(r => { if (!merged[r.id]) merged[r.id] = r; });
          let finalResults = Object.values(merged);

          // Sort: owned first
          const ownedIds = collectionIds;
          finalResults.sort((a, b) => {
            const aOwned = ownedIds.has(a.id) ? 0 : 1;
            const bOwned = ownedIds.has(b.id) ? 0 : 1;
            return aOwned - bOwned;
          });

          setApiResults(finalResults);
          setPagination(d.pagination || null);
          setPage(p);

          if (p === 1 && ff.length === 0 && fs.length === 0 && fy.length === 0 && fc.length === 0) {
            setAvailableFilters(extractFilterOptions(finalResults));
          }
        } catch (e) {
          if (gen !== searchGen.current) return; // stale search errored, ignore
          setError(e.message); setApiResults([]);
        } finally {
          if (gen === searchGen.current) setSearching(false);
        }
      };

      const handleSearchText = (text) => {
        setQuery(text);
        setSearchType('query');
        setFilterFormats([]); setFilterSizes([]); setFilterYears([]); setFilterCountries([]); setFilterLabels([]);
        setAvailableFilters({ years: [], countries: [], formats: [], labels: [] });
        setDismissedIds(new Set());
        setActiveView('search');
        doSearch(1, { formats: [], sizes: [], years: [], countries: [] }, text, 'query');
      };

      const handleSearchCatno = (catno) => {
        setQuery(catno);
        setSearchType('catno');
        setFilterFormats([]); setFilterSizes([]); setFilterYears([]); setFilterCountries([]); setFilterLabels([]);
        setAvailableFilters({ years: [], countries: [], formats: [], labels: [] });
        setDismissedIds(new Set());
        setActiveView('search');
        doSearch(1, { formats: [], sizes: [], years: [], countries: [] }, catno, 'catno');
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        setFilterFormats([]); setFilterSizes([]); setFilterYears([]); setFilterCountries([]); setFilterLabels([]);
        setAvailableFilters({ years: [], countries: [], formats: [], labels: [] });
        setDismissedIds(new Set());
        doSearch(1, { formats: [], sizes: [], years: [], countries: [] });
      };

      const handleClearSearch = () => {
        searchGen.current++; // cancel any in-flight search
        setQuery('');
        setFilterFormats([]); setFilterSizes([]); setFilterYears([]); setFilterCountries([]); setFilterLabels([]);
        setAvailableFilters({ years: [], countries: [], formats: [], labels: [] });
        setApiResults([]); setLocalResults([]);
        setHasSearched(false); setSearching(false); setError('');
        setPagination(null); setPage(1);
        setShowAllImages(false); setExpandedThumbId(null); setReleaseImages({});
        setDismissedIds(new Set());
        imagesAbort.current = true;
      };

      const handleFilterChange = (setter, key) => (val) => {
        setter(val);
        // For catno searches, filters are applied client-side (no re-fetch)
        if (searchType === 'catno') return;
        const filters = { formats: filterFormats, sizes: filterSizes, years: filterYears, countries: filterCountries, labels: filterLabels };
        filters[key] = val;
        doSearch(1, filters);
      };

      const splitTitle = (t) => {
        for (const sep of [' - ', ' \u2014 ']) {
          const i = t.indexOf(sep);
          if (i !== -1) return { artist: t.slice(0, i), title: t.slice(i + sep.length) };
        }
        return { artist: '', title: t };
      };

      const onAdded = (r, instanceId, folderId, notesList) => {
        setCollectionIds(prev => new Set([...prev, r.id]));
        const { artist, title } = splitTitle(r.title);
        const newItem = {
          instance_id: instanceId,
          folder_id: Number(folderId),
          id: r.id,
          notes: notesList || [],
          basic_information: {
            id: r.id,
            title: title,
            artists: artist ? [{ name: artist }] : [],
            cover_image: r.cover_image || '',
            formats: (r.format || []).map(f => ({ name: f, descriptions: [] })),
            labels: (r.label || []).map(l => ({ name: l, catno: r.catno || '' })),
            year: r.year ? Number(r.year) : 0,
          }
        };
        setCollectionRaw(prev => [...prev, newItem]);
      };
      const onRemoved = (id, instanceId) => {
        setCollectionIds(prev => { const s = new Set(prev); s.delete(id); return s; });
        setCollectionRaw(prev => prev.filter(item => item.instance_id !== instanceId));
      };
      const onWanted = (r) => {
        setWantlistIds(prev => new Set([...prev, r.id]));
        const { artist, title } = splitTitle(r.title);
        const newWant = {
          id: r.id,
          basic_information: {
            id: r.id,
            title: title,
            artists: artist ? [{ name: artist }] : [],
            cover_image: r.cover_image || '',
            formats: (r.format || []).map(f => ({ name: f, descriptions: [] })),
            labels: (r.label || []).map(l => ({ name: l, catno: r.catno || '' })),
            year: r.year ? Number(r.year) : 0,
          }
        };
        setWantlistRaw(prev => [...prev, newWant]);
      };
      const onUnwanted = (id) => {
        setWantlistIds(prev => { const s = new Set(prev); s.delete(id); return s; });
        setWantlistRaw(prev => prev.filter(w => w.basic_information?.id !== id && w.id !== id));
      };

      const savePersonal = async (releaseId, data) => {
        if (!BACKEND_API) return;
        const res = await backendPut(`/api/fields/${releaseId}`, token, data);
        setPersonalFields(prev => ({ ...prev, [releaseId]: { ...data, updated_at: res.updated_at } }));
      };
      const deletePersonal = async (releaseId) => {
        if (!BACKEND_API) return;
        await backendDelete(`/api/fields/${releaseId}`, token);
        setPersonalFields(prev => {
          const next = { ...prev }; delete next[releaseId]; return next;
        });
      };

      // Lookup: release id → collection instance (for removal)
      const collectionMap = {};
      collectionRaw.forEach(item => { if (!collectionMap[item.basic_information.id]) collectionMap[item.basic_information.id] = item; });

      // Normalize catno for exact matching: strip spaces and hyphens, lowercase
      const normCatno = (s) => (s || '').replace(/[\s\-]/g, '').toLowerCase();

      // Client-side filtering (multi-select can't be pushed to API for >1 value,
      // so always filter locally after results come back)
      const sizes = ['12"', '7"', '10"'];
      const filtered = apiResults.filter(r => {
        if (searchType === 'catno' && exactCatno && normCatno(r.catno) !== normCatno(query)) return false;
        if (filterFormats.length && !(r.format || []).some(f => filterFormats.includes(f))) return false;
        if (filterSizes.length) {
          const fmts = r.format || [];
          const hasAnySize = fmts.some(f => sizes.some(s => f.includes(s)));
          if (hasAnySize && !fmts.some(f => filterSizes.some(s => f.includes(s)))) return false;
        }
        if (filterYears.length && !filterYears.includes(r.year)) return false;
        if (filterCountries.length && !filterCountries.includes(r.country)) return false;
        if (filterLabels.length && !(r.label || []).some(l => filterLabels.includes(l))) return false;
        return true;
      });

      // Split: local matches shown on top, API results without owned duplicates below
      const apiIds = new Set(filtered.map(r => r.id));
      const uniqueLocal = localResults.filter(item => {
        if (apiIds.has(item.basic_information.id)) return false;
        if (exactCatno && searchType === 'catno') {
          const needle = normCatno(query);
          if (!(item.basic_information.labels || []).some(l => normCatno(l.catno) === needle)) return false;
        }
        return true;
      });
      const apiNotOwned = filtered.filter(r => !collectionIds.has(r.id));
      const apiOwned = filtered.filter(r => collectionIds.has(r.id));
      const allOwnedApi = apiOwned;

      // For catno searches, derive filter options from the visible results so
      // dropdowns only show values that exist after exact-match / other filtering.
      // Always include any currently selected values so they remain visible for deselection.
      const visibleFilters = (searchType === 'catno') ? extractFilterOptions(filtered) : availableFilters;
      const ensureSelected = (opts, selected) => {
        const missing = selected.filter(s => !opts.includes(s));
        return missing.length ? [...opts, ...missing] : opts;
      };
      const yearOptions = ensureSelected(visibleFilters.years, filterYears);
      const countryOptions = ensureSelected(visibleFilters.countries, filterCountries);
      const labelOptions = ensureSelected(visibleFilters.labels, filterLabels);
      const rawFormats = visibleFilters.formats.length > 0
        ? visibleFilters.formats.filter(f => !['12"','7"','10"','LP'].includes(f))
        : ['Vinyl','CD','Cassette','DVD','Box Set'];
      const formatOptions = ensureSelected(rawFormats, filterFormats);

      const visibleUniqueLocal = uniqueLocal.filter(item => !dismissedIds.has(item.basic_information.id));
      const visibleApiOwned = allOwnedApi.filter(r => !dismissedIds.has(r.id));
      const visibleApiNotOwned = apiNotOwned.filter(r => !dismissedIds.has(r.id));
      const totalOwned = visibleUniqueLocal.length + visibleApiOwned.length;
      const totalResults = visibleApiOwned.length + visibleApiNotOwned.length + visibleUniqueLocal.length;
      const dismissResult = (id) => setDismissedIds(prev => { const n = new Set(prev); n.add(id); return n; });

      // Collection view: compute filter/sort data once so both sidebar and main can use it
      const collView = activeView === 'collection' ? (() => {
        const q = collSearch.trim().toLowerCase();
        const collFiltered = collectionRaw.filter(item => {
          if (!filterCollectionItem(item, collFilter)) return false;
          if (!q) return true;
          const info = item.basic_information;
          const artists = (info.artists || []).map(a => a.name.toLowerCase()).join(' ');
          const title = (info.title || '').toLowerCase();
          return artists.includes(q) || title.includes(q);
        });
        const collSorted = [...collFiltered].sort((a, b) => {
          const aInfo = a.basic_information, bInfo = b.basic_information;
          const aArtist = (aInfo.artists || []).map(x => x.name).join(', ').toLowerCase();
          const bArtist = (bInfo.artists || []).map(x => x.name).join(', ').toLowerCase();
          if (collSort === 'artist_year') {
            const artistCmp = aArtist.localeCompare(bArtist);
            if (artistCmp !== 0) return artistCmp;
            return (aInfo.year || 0) - (bInfo.year || 0);
          }
          const aStr = aArtist + ' ' + (aInfo.title || '').toLowerCase();
          const bStr = bArtist + ' ' + (bInfo.title || '').toLowerCase();
          return aStr.localeCompare(bStr);
        });
        const collOpts = extractCollectionFilterOptions(collectionRaw);
        const collSlice = collSorted.slice(0, Math.min(effectiveCollShown, collSorted.length));
        const hasMore = collSlice.length < collSorted.length;
        const hasCollFilter = collFilter.formats.length || collFilter.sizes.length || collFilter.years.length || collFilter.labels.length || collFilter.folders.length || q;
        const folderOptsColl = folders.map(f => String(f.id));
        const folderLabelColl = (id) => { const f = folders.find(x => String(x.id) === id); return f ? `${f.name} (${f.count})` : id; };
        return { collSorted, collOpts, collSlice, hasMore, hasCollFilter, folderOptsColl, folderLabelColl };
      })() : null;

      // Wantlist view: same pattern
      const wantView = activeView === 'wantlist' ? (() => {
        const wantFiltered = wantlistRaw.filter(item => filterCollectionItem(item, wantFilter));
        const wantSorted = [...wantFiltered].sort((a, b) => {
          const aInfo = a.basic_information, bInfo = b.basic_information;
          const aStr = ((aInfo.artists || []).map(x => x.name).join(', ') + ' ' + aInfo.title).toLowerCase();
          const bStr = ((bInfo.artists || []).map(x => x.name).join(', ') + ' ' + bInfo.title).toLowerCase();
          return aStr.localeCompare(bStr);
        });
        const wantOpts = extractCollectionFilterOptions(wantlistRaw);
        const wantSlice = wantSorted.slice(0, Math.min(effectiveWantShown, wantSorted.length));
        const hasMore = wantSlice.length < wantSorted.length;
        const hasWantFilter = wantFilter.formats.length || wantFilter.sizes.length || wantFilter.years.length || wantFilter.labels.length;
        return { wantSorted, wantOpts, wantSlice, hasMore, hasWantFilter };
      })() : null;

      return (
        <div>
          <div className="header">
            <div className="header-row">
              <div>
                <h1>RunOut</h1>
                <p>Search Discogs — fast & easy</p>
              </div>
              <div className="header-actions">
                {connected && (
                  activeView === 'wantlist'
                    ? <span className="header-badge">{wantlistRaw.length} wanted</span>
                    : <span className="header-badge">{collectionRaw.length} records</span>
                )}
                <button type="button" className="theme-toggle"
                  onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
                  aria-label={theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'}
                  title={theme === 'dark' ? 'Light mode' : 'Dark mode'}>
                  {theme === 'dark' ? '☀' : '☾'}
                </button>
              </div>
            </div>
          </div>
          <div className={`container${activeView === 'collection' && collSidebarHidden ? ' sidebar-hidden' : ''}`}>
            {!(activeView === 'collection' && collSidebarHidden) && (
            <aside className="sidebar">
              <div className="sidebar-inner">
              {/* Settings */}
              <div className="card" style={{marginBottom:14}}>
                <button className="settings-toggle" onClick={() => setSettingsOpen(!settingsOpen)}>
                  <span>{connected ? `✓ Connected as ${username}` : 'Settings'}</span>
                  <span className={`arrow ${settingsOpen ? 'open' : ''}`}>▼</span>
                </button>
                {settingsOpen && (
                  <div className="settings-body">
                    <div className="field">
                      <label>Discogs API Token</label>
                      <input type="password" value={token} onChange={e=>setToken(e.target.value)} placeholder="Your personal access token" />
                      <TokenHelp />
                    </div>
                    <button className="btn-primary" onClick={() => handleConnect()} disabled={!token||collLoading}>
                      {collLoading ? `Loading collection... ${loadProg}` : connected ? `Connected (${collectionRaw.length} records)` : 'Connect & load collection'}
                    </button>
                    {connected && cacheInfo && <div className="cache-msg">Cached: {cacheInfo.count} records, updated {timeAgo(cacheInfo.ts)}</div>}
                    {connected && <button className="btn-secondary" onClick={handleRefresh} disabled={collLoading}>Refresh collection from Discogs</button>}
                    {connected && <button className="btn-secondary" onClick={handleDisconnect}>Switch account</button>}
                    {connected && <button className="btn-danger" onClick={handleDeleteAccount}>Delete cached data &amp; log out</button>}
                    {!connected && accounts.length > 0 && (
                      <div style={{marginTop:12}}>
                        <label>Saved accounts</label>
                        <div style={{display:'flex',flexDirection:'column',gap:6,marginTop:4}}>
                          {accounts.map(a => (
                            <button key={a.username} className="btn-secondary" style={{marginTop:0,display:'flex',justifyContent:'space-between',alignItems:'center'}}
                              onClick={() => { handleSwitchAccount(a); handleConnect(a.token, a.username); }}>
                              <span>{a.username}</span>
                              <span style={{fontSize:11,color:'#999'}}>tap to connect</span>
                            </button>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>

              {connected && (
                <>
                  {/* View navigation */}
                  <div className="view-nav">
                    <button className={activeView==='search' ? 'active' : ''} onClick={()=>{setActiveView('search');setPage(1);}}>Search</button>
                    <button className={activeView==='collection' ? 'active' : ''} onClick={()=>{setActiveView('collection');setPage(1);}}>Collection</button>
                    <button className={activeView==='wantlist' ? 'active' : ''} onClick={()=>{setActiveView('wantlist');setPage(1);}}>Wantlist</button>
                  </div>

                  {/* Search view: sidebar controls */}
                  {activeView === 'search' && (
                    <>
                      <div className="search-tabs">
                        {[['catno','Cat No'],['barcode','Barcode'],['query','Search']].map(([k,l]) => (
                          <button key={k} className={`search-tab ${searchType===k ? 'active' : ''}`}
                            onClick={()=>setSearchType(k)}>{l}</button>
                        ))}
                      </div>
                      <form className="search-row" onSubmit={handleSubmit}>
                        <div className="search-input-wrap">
                          <input type="text" value={query}
                            onChange={e=>setQuery(searchType==='catno' ? e.target.value.toUpperCase() : e.target.value)}
                            style={searchType==='catno' ? {textTransform:'uppercase'} : {}}
                            placeholder={
                              searchType==='catno' ? 'Catalog number, e.g. SBLP 001...'
                              : searchType==='barcode' ? 'Barcode number...'
                              : 'Artist, titel...'
                            } />
                          {query && <button type="button" className="search-clear" onClick={handleClearSearch} aria-label="Clear">×</button>}
                        </div>
                        {searchType === 'barcode' && IS_NATIVE && (
                          <button type="button" className="btn-scan" onClick={async () => {
                            const code = await scanBarcode();
                            if (code) {
                              setQuery(code);
                              setFilterFormats([]); setFilterSizes([]); setFilterYears([]); setFilterCountries([]); setFilterLabels([]);
                              setAvailableFilters({ years: [], countries: [], formats: [], labels: [] });
                              setDismissedIds(new Set());
                              doSearch(1, { formats: [], sizes: [], years: [], countries: [] }, code, 'barcode');
                            }
                          }} aria-label="Scan barcode">📷</button>
                        )}
                        <button type="submit" disabled={!query.trim()||searching}>
                          {searching ? <><span className="spinner"></span></> : 'Search'}
                        </button>
                      </form>
                      {searchType === 'catno' && (
                        <label style={{display:'flex',alignItems:'center',gap:6,fontSize:13,color:'#555',marginTop:6,cursor:'pointer'}}>
                          <input type="checkbox" checked={exactCatno} onChange={e=>setExactCatno(e.target.checked)} />
                          Exact matches only
                        </label>
                      )}
                      {hasSearched && apiResults.length > 0 && (() => {
                        const activeCount = filterFormats.length + filterSizes.length + filterYears.length + filterCountries.length + filterLabels.length;
                        return (
                          <div style={{marginTop:10}}>
                            <button type="button" className="filters-toggle" onClick={() => setFiltersVisible(!filtersVisible)}>
                              <span>{filtersVisible ? '▾ Hide filters' : '▸ Show filters'}</span>
                              {!filtersVisible && activeCount > 0 && <span className="filters-toggle-badge">{activeCount}</span>}
                            </button>
                            {filtersVisible && (
                              <div className="filters">
                                <MultiSelect options={formatOptions} selected={filterFormats} onChange={handleFilterChange(setFilterFormats, 'formats')} placeholder="Format..." />
                                <MultiSelect options={['12"','7"','10"']} selected={filterSizes} onChange={handleFilterChange(setFilterSizes, 'sizes')} placeholder="Size..." />
                                <MultiSelect options={yearOptions} selected={filterYears} onChange={handleFilterChange(setFilterYears, 'years')} placeholder="Year..." />
                                <MultiSelect options={countryOptions} selected={filterCountries} onChange={handleFilterChange(setFilterCountries, 'countries')} placeholder="Country..." />
                                {labelOptions.length > 0 && (
                                  <MultiSelect options={labelOptions} selected={filterLabels} onChange={handleFilterChange(setFilterLabels, 'labels')} placeholder="Label..." />
                                )}
                              </div>
                            )}
                          </div>
                        );
                      })()}
                    </>
                  )}

                  {/* Collection view: sidebar controls */}
                  {activeView === 'collection' && collView && collectionRaw.length > 0 && (
                    <>
                      <div className="search-row">
                        <div className="search-input-wrap">
                          <input type="text" value={collSearch}
                            onChange={e => { setCollSearch(e.target.value); setPage(1); }}
                            placeholder="Search artist or title..." />
                          {collSearch && <button type="button" className="search-clear" onClick={()=>{setCollSearch(''); setPage(1);}} aria-label="Clear">×</button>}
                        </div>
                      </div>
                      <div className="filters">
                        <MultiSelect options={collView.collOpts.formats.filter(f => !['12"','7"','10"','LP'].includes(f))} selected={collFilter.formats} onChange={v => setCollFilter(f => ({...f, formats: v}))} placeholder="Format..." />
                        <MultiSelect options={['12"','7"','10"']} selected={collFilter.sizes} onChange={v => setCollFilter(f => ({...f, sizes: v}))} placeholder="Size..." />
                        <MultiSelect options={collView.collOpts.years} selected={collFilter.years} onChange={v => setCollFilter(f => ({...f, years: v}))} placeholder="Year..." />
                        <MultiSelect options={collView.collOpts.labels} selected={collFilter.labels} onChange={v => setCollFilter(f => ({...f, labels: v}))} placeholder="Label..." />
                        {folders.length > 0 && (
                          <MultiSelect options={collView.folderOptsColl} selected={collFilter.folders} onChange={v => setCollFilter(f => ({...f, folders: v}))} placeholder="Folder..." renderOption={collView.folderLabelColl} />
                        )}
                      </div>
                    </>
                  )}

                  {/* Wantlist view: sidebar controls */}
                  {activeView === 'wantlist' && wantView && wantlistRaw.length > 0 && (() => {
                    const activeCount = wantFilter.formats.length + wantFilter.sizes.length + wantFilter.years.length + wantFilter.labels.length;
                    return (
                      <>
                        <button type="button" className="filters-toggle" onClick={() => setFiltersVisible(!filtersVisible)}>
                          <span>{filtersVisible ? '▾ Hide filters' : '▸ Show filters'}</span>
                          {!filtersVisible && activeCount > 0 && <span className="filters-toggle-badge">{activeCount}</span>}
                        </button>
                        {filtersVisible && (
                          <div className="filters">
                            <MultiSelect options={wantView.wantOpts.formats.filter(f => !['12"','7"','10"','LP'].includes(f))} selected={wantFilter.formats} onChange={v => setWantFilter(f => ({...f, formats: v}))} placeholder="Format..." />
                            <MultiSelect options={['12"','7"','10"']} selected={wantFilter.sizes} onChange={v => setWantFilter(f => ({...f, sizes: v}))} placeholder="Size..." />
                            <MultiSelect options={wantView.wantOpts.years} selected={wantFilter.years} onChange={v => setWantFilter(f => ({...f, years: v}))} placeholder="Year..." />
                            <MultiSelect options={wantView.wantOpts.labels} selected={wantFilter.labels} onChange={v => setWantFilter(f => ({...f, labels: v}))} placeholder="Label..." />
                          </div>
                        )}
                      </>
                    );
                  })()}
                </>
              )}
              </div>
            </aside>
            )}

            <main className="main-col" ref={mainRef}>
              {connected && activeView === 'search' && (
                <>
                  {error && <div className="error-msg">{error}</div>}
                  {hasSearched && !searching && (
                    <>
                      {totalResults > 0 && (
                        <div className="hit-count">
                          {totalResults} results
                          {totalOwned > 0 && ` · ${totalOwned} owned`}
                          {dismissedIds.size > 0 && ` · `}
                          {dismissedIds.size > 0 && (
                            <button type="button" onClick={() => setDismissedIds(new Set())}
                              style={{background:'none',border:'none',padding:0,fontSize:'inherit',color:'#4f46e5',cursor:'pointer',fontWeight:600,fontFamily:'inherit'}}>
                              {dismissedIds.size} hidden — show all
                            </button>
                          )}
                          {pagination?.pages > 1 && (searchType !== 'catno' && searchType !== 'barcode') && ` · page ${page}/${pagination.pages}`}
                        </div>
                      )}

                      {totalResults > 0 && (
                        <button className="gallery-toggle" style={{marginBottom:10}} onClick={() => {
                          const next = !showAllImages;
                          setShowAllImages(next);
                          setExpandedThumbId(null);
                        }}>
                          {showAllImages ? '▾ Hide all images' : '▸ Show all images'}
                        </button>
                      )}

                      {showAllImages && totalResults > 0 && (() => {
                          const allReleases = [
                            ...uniqueLocal.map(item => ({ ...itemToResult(item) })),
                            ...filtered
                          ];
                          // Determine how many releases have been fetched
                          const fetchedCount = allReleases.filter(r => releaseImages[r.id] !== undefined).length;
                          // Load next batch of unfetched releases
                          const BATCH = 6;
                          const loadNextBatch = () => {
                            if (imagesLoading) return;
                            const unfetched = allReleases.filter(r => releaseImages[r.id] === undefined);
                            if (unfetched.length === 0) return;
                            const batch = unfetched.slice(0, BATCH);
                            imagesAbort.current = false;
                            setImagesLoading(true);
                            setImagesProgress(`${fetchedCount}/${allReleases.length}`);
                            (async () => {
                              let loaded = fetchedCount;
                              for (const r of batch) {
                                if (imagesAbort.current) break;
                                try {
                                  const d = await dGet(`/releases/${r.id}`, token);
                                  const imgs = (d.images || []).map(img => ({ uri150: img.uri150, uri: img.uri, type: img.type }));
                                  setReleaseImages(prev => ({ ...prev, [r.id]: imgs }));
                                } catch(e) {
                                  setReleaseImages(prev => ({ ...prev, [r.id]: [] }));
                                }
                                loaded++;
                                setImagesProgress(`${loaded}/${allReleases.length}`);
                                if (loaded < fetchedCount + batch.length && !imagesAbort.current) await new Promise(res => setTimeout(res, 1100));
                              }
                              setImagesLoading(false);
                            })();
                          };
                          // Auto-load first batch
                          if (fetchedCount === 0 && !imagesLoading) setTimeout(loadNextBatch, 0);
                          // Build flat list from fetched releases only
                          const thumbList = [];
                          allReleases.forEach(r => {
                            const imgs = releaseImages[r.id];
                            if (imgs && imgs.length > 0) {
                              imgs.forEach((img, i) => thumbList.push({ img, release: r, key: `${r.id}_${i}` }));
                            }
                          });
                          const hasMore = fetchedCount < allReleases.length;
                          return (
                            <div className="card" style={{padding:14,marginBottom:12}}>
                              <div style={{fontSize:13,fontWeight:700,color:'#555',marginBottom:10}}>
                                All images {imagesLoading
                                  ? <span style={{fontWeight:400,color:'#999'}}>— loading {imagesProgress}...</span>
                                  : `(${thumbList.length})`}
                              </div>
                              <div className="thumb-grid">
                                {thumbList.map(t => (
                                  <React.Fragment key={t.key}>
                                    <img
                                      src={t.img.uri150}
                                      className={`thumb-grid-item ${expandedThumbId === t.key ? 'active' : ''}`}
                                      alt={t.img.type || ''}
                                      title={`${t.release.title} — ${t.img.type || 'image'}`}
                                      onClick={() => setExpandedThumbId(expandedThumbId === t.key ? null : t.key)}
                                      onMouseEnter={e => { setHoverPreview({ uri: t.img.uri, x: e.clientX, y: e.clientY }); }}
                                      onMouseMove={movePreview}
                                      onMouseLeave={() => setHoverPreview(null)}
                                      onError={e => e.target.style.display='none'}
                                    />
                                    {expandedThumbId === t.key && (
                                      <div className="thumb-grid-expanded">
                                        <ResultCard r={t.release} owned={collectionIds.has(t.release.id)} wanted={wantlistIds.has(t.release.id)}
                                          collectionInstance={collectionMap[t.release.id]} token={token} username={username}
                                          folders={folders} fields={fields} defaultFolder={lastFolder} defaultMedia={lastMedia}
                                          onAdded={onAdded} onRemoved={onRemoved} onWanted={onWanted} onUnwanted={onUnwanted}
                                          onPrefsUpdate={handlePrefsUpdate} onSearchText={handleSearchText} onSearchCatno={handleSearchCatno}
                                          onClose={() => setExpandedThumbId(null)} activeSizeFilters={filterSizes}
                                          personal={personalFields[t.release.id]} onSavePersonal={savePersonal} onDeletePersonal={deletePersonal} />
                                      </div>
                                    )}
                                  </React.Fragment>
                                ))}
                              </div>
                              {imagesLoading && (
                                <div style={{textAlign:'center',padding:'12px 0'}}><div className="spinner" style={{width:20,height:20}}></div></div>
                              )}
                              {!imagesLoading && hasMore && (
                                <button className="gallery-toggle" style={{textAlign:'center',width:'100%',padding:'10px 0'}} onClick={loadNextBatch}>
                                  Load more images ({allReleases.length - fetchedCount} releases remaining)
                                </button>
                              )}
                            </div>
                          );
                        })()}

                      {/* Owned: local matches + API-owned, shown at top */}
                      {totalOwned > 0 && (
                        <>
                          <div className="section-label owned">
                            <span>In your collection ({totalOwned})</span>
                            <span className="line"></span>
                          </div>
                          <div className="result-grid">
                            {visibleUniqueLocal.map(item => <CollectionCard key={item.instance_id} item={item} onClose={() => dismissResult(item.basic_information.id)} />)}
                            {visibleApiOwned.map(r => (
                              <ResultCard key={r.id} r={r} owned={true} wanted={wantlistIds.has(r.id)} collectionInstance={collectionMap[r.id]} token={token} username={username}
                                folders={folders} fields={fields} defaultFolder={lastFolder} defaultMedia={lastMedia}
                                onAdded={onAdded} onRemoved={onRemoved} onWanted={onWanted} onUnwanted={onUnwanted} onPrefsUpdate={handlePrefsUpdate} onSearchText={handleSearchText} onSearchCatno={handleSearchCatno} onClose={() => dismissResult(r.id)} activeSizeFilters={filterSizes}
                                personal={personalFields[r.id]} onSavePersonal={savePersonal} onDeletePersonal={deletePersonal} />
                            ))}
                          </div>
                        </>
                      )}

                      {/* Not owned: only non-owned API results */}
                      {visibleApiNotOwned.length > 0 && (
                        <>
                          {totalOwned > 0 && (
                            <div className="section-label discogs">
                              <span>Other releases ({visibleApiNotOwned.length})</span>
                              <span className="line"></span>
                            </div>
                          )}
                          <div className="result-grid">
                            {visibleApiNotOwned.map(r => (
                              <ResultCard key={r.id} r={r} owned={false} wanted={wantlistIds.has(r.id)} token={token} username={username}
                                folders={folders} fields={fields} defaultFolder={lastFolder} defaultMedia={lastMedia}
                                onAdded={onAdded} onRemoved={onRemoved} onWanted={onWanted} onUnwanted={onUnwanted} onPrefsUpdate={handlePrefsUpdate} onSearchText={handleSearchText} onSearchCatno={handleSearchCatno} onClose={() => dismissResult(r.id)} activeSizeFilters={filterSizes}
                                personal={personalFields[r.id]} onSavePersonal={savePersonal} onDeletePersonal={deletePersonal} />
                            ))}
                          </div>
                        </>
                      )}

                      {totalResults === 0 && !error && <div className="empty-state"><p>No results</p></div>}

                      {pagination?.pages > 1 && (searchType !== 'catno' && searchType !== 'barcode') && (
                        <div className="pagination">
                          <button onClick={()=>doSearch(page-1)} disabled={page<=1}>← Previous</button>
                          <button onClick={()=>doSearch(page+1)} disabled={page>=pagination.pages}>Next →</button>
                        </div>
                      )}
                    </>
                  )}

                  {searching && <div className="empty-state"><div className="spinner" style={{width:24,height:24}}></div><p>Searching...</p></div>}

                  {!hasSearched && (
                    <div className="empty-state">
                      <div className="icon">🎵</div>
                      <p>Search by catalog number, barcode or keywords</p>
                    </div>
                  )}
                </>
              )}

              {connected && activeView === 'collection' && collView && (
                <>
                  {collectionRaw.length > 0 && (() => {
                    const activeFilterCount = collFilter.formats.length + collFilter.sizes.length + collFilter.years.length + collFilter.labels.length + collFilter.folders.length;
                    return (
                      <div className="results-header">
                        <div className="hit-count">{collView.hasCollFilter ? `${collView.collSorted.length} matching releases` : ''}</div>
                        <div className="results-header-controls">
                          <button type="button" className="sidebar-toggle-btn"
                            onClick={() => setCollSidebarHidden(!collSidebarHidden)}
                            title={collSidebarHidden ? 'Show filters' : 'Hide filters'}>
                            {collSidebarHidden
                              ? <>▸ Filters{activeFilterCount > 0 ? ` · ${activeFilterCount}` : ''}</>
                              : '◂ Hide filters'}
                          </button>
                          <select className="sort-select" value={collSort} onChange={e => setCollSort(e.target.value)}>
                            <option value="artist_title">Artist + Title</option>
                            <option value="artist_year">Artist + Year</option>
                          </select>
                          <div className="layout-toggle">
                            <button className={collLayout==='list' ? 'active' : ''} onClick={() => setCollLayout('list')}>List</button>
                            <button className={collLayout==='grid' ? 'active' : ''} onClick={() => setCollLayout('grid')}>Grid</button>
                          </div>
                        </div>
                      </div>
                    );
                  })()}
                  {collLayout === 'grid' ? (
                    <div className="browse-grid">
                      {collView.collSlice.map(item => {
                        const info = item.basic_information;
                        const title = info.title || '';
                        const artist = (info.artists || []).map(a => a.name).join(', ');
                        const img = info.cover_image || info.thumb || '';
                        return (
                          <div key={item.instance_id} className={`browse-card ${modalItem && modalItem.instance_id === item.instance_id ? 'active' : ''}`} onClick={() => setModalItem(item)}>
                            {img ? <img src={img} className="browse-card-img" alt="" onError={e => { e.target.style.visibility = 'hidden'; }} />
                                 : <div className="browse-card-img" />}
                            <div className="bc-title" title={`${artist} — ${title}`}>{title}</div>
                            <div className="bc-artist" title={artist}>{artist}</div>
                          </div>
                        );
                      })}
                    </div>
                  ) : (
                    <div className="result-grid">
                      {collView.collSlice.map(item => {
                        const r = itemToResult(item);
                        return (
                          <ResultCard key={item.instance_id} r={r} owned={true} hideOwned={true} collectionInstance={item} wanted={wantlistIds.has(r.id)} token={token} username={username}
                            folders={folders} fields={fields} defaultFolder={lastFolder} defaultMedia={lastMedia}
                            onAdded={onAdded} onRemoved={onRemoved} onWanted={onWanted} onUnwanted={onUnwanted} onPrefsUpdate={handlePrefsUpdate} onSearchText={handleSearchText} onSearchCatno={handleSearchCatno}
                            personal={personalFields[r.id]} onSavePersonal={savePersonal} onDeletePersonal={deletePersonal} />
                        );
                      })}
                    </div>
                  )}
                  {collectionRaw.length === 0 && (
                    <div className="empty-state">
                      <div className="icon">📀</div>
                      <p>Your collection is empty</p>
                    </div>
                  )}
                  {collView.collSorted.length > 0 && collView.collSlice.length === 0 && (
                    <div className="empty-state"><p>No matches for current filters</p></div>
                  )}
                  {collView.hasMore && <div ref={collSentinelRef} style={{height:1}} />}
                </>
              )}

              {connected && activeView === 'wantlist' && wantView && (
                <>
                  {wantlistRaw.length > 0 && wantView.hasWantFilter && (
                    <div className="hit-count">{wantView.wantSorted.length} matching releases</div>
                  )}
                  <div className="result-grid">
                    {wantView.wantSlice.map(w => {
                      const r = itemToResult(w);
                      return (
                        <ResultCard key={r.id} r={r} owned={collectionIds.has(r.id)} wanted={true} collectionInstance={collectionMap[r.id]} token={token} username={username}
                          folders={folders} fields={fields} defaultFolder={lastFolder} defaultMedia={lastMedia}
                          onAdded={onAdded} onRemoved={onRemoved} onWanted={onWanted} onUnwanted={onUnwanted} onPrefsUpdate={handlePrefsUpdate} onSearchText={handleSearchText} onSearchCatno={handleSearchCatno}
                          personal={personalFields[r.id]} onSavePersonal={savePersonal} onDeletePersonal={deletePersonal} />
                      );
                    })}
                  </div>
                  {wantlistRaw.length === 0 && (
                    <div className="empty-state">
                      <div className="icon">♡</div>
                      <p>Your wantlist is empty</p>
                    </div>
                  )}
                  {wantView.wantSorted.length > 0 && wantView.wantSlice.length === 0 && (
                    <div className="empty-state"><p>No matches for current filters</p></div>
                  )}
                  {wantView.hasMore && <div ref={wantSentinelRef} style={{height:1}} />}
                </>
              )}

              {!connected && !collLoading && (
                <div className="empty-state">
                  <div className="icon">🎵</div>
                  <p>Enter your Discogs API token above to get started</p>
                </div>
              )}
            </main>

            {false && !IS_IOS && (
              <div className="footer-cta">
                <a href="https://buymeacoffee.com/RickardEngberg" target="_blank" rel="noopener"
                  style={{display:'inline-flex',alignItems:'center',gap:6,background:'#FFDD00',color:'#000',fontWeight:700,fontSize:13,padding:'8px 18px',borderRadius:10,textDecoration:'none'}}>
                  ☕ Buy me a coffee
                </a>
                <p style={{fontSize:11,color:'#aaa',marginTop:8}}>If you find RunOut useful, consider supporting its development</p>
              </div>
            )}
          </div>
          {hoverPreview && (
            <div ref={previewRef} className="thumb-preview" style={{left: hoverPreview.x + 24, top: hoverPreview.y + 24}}>
              <img src={hoverPreview.uri} alt="" />
            </div>
          )}
          {showToTop && (
            <button className="to-top" onClick={scrollToTop} aria-label="Scroll to top" title="Scroll to top">↑</button>
          )}
          {showChanges && (
            <div className="modal-backdrop" onClick={() => setShowChanges(false)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <button className="modal-close" onClick={() => setShowChanges(false)} aria-label="Close">×</button>
                <div className="modal-body">
                  {changesHtml === null
                    ? <div className="empty-state"><div className="spinner" style={{width:20,height:20}}></div></div>
                    : <div dangerouslySetInnerHTML={{__html: changesHtml}} />}
                </div>
              </div>
            </div>
          )}
          {modalItem && (() => {
            const info = modalItem.basic_information;
            const artist = (info.artists || []).map(a => a.name).join(', ');
            const title = info.title || '';
            const year = info.year > 0 ? info.year : null;
            const img = info.cover_image || info.thumb || '';
            const tracks = modalDetails?.tracklist || [];
            return (
              <div className="modal-backdrop" onClick={() => setModalItem(null)}>
                <div className="modal" onClick={e => e.stopPropagation()}>
                  <button className="modal-close" onClick={() => setModalItem(null)} aria-label="Close">×</button>
                  <div className="modal-body">
                    {img && <img src={img} className="modal-cover" alt="" onError={e => e.target.style.display='none'} />}
                    {artist && <div className="modal-artist">{artist}</div>}
                    <div className="modal-title">{title}</div>
                    {year && <div className="modal-year">{year}</div>}
                    <div className="modal-section">
                      <div className="modal-section-label">Tracks</div>
                      {modalLoading && <div className="empty-state" style={{padding:'16px 0'}}><div className="spinner" style={{width:20,height:20}}></div></div>}
                      {!modalLoading && tracks.length === 0 && <div style={{fontSize:13,color:'#999'}}>No tracks listed</div>}
                      {!modalLoading && tracks.length > 0 && (
                        <ol className="tracklist">
                          {tracks.map((t, i) => {
                            const trackArtist = (t.artists || []).map(a => a.name).join(', ');
                            return (
                              <li key={i} className="track">
                                <span className="track-pos">{t.position}</span>
                                <span className="track-title">
                                  {t.title}
                                  {trackArtist && trackArtist !== artist && <span className="track-artist">— {trackArtist}</span>}
                                </span>
                                {t.duration && <span className="track-dur">{t.duration}</span>}
                              </li>
                            );
                          })}
                        </ol>
                      )}
                    </div>
                    <a className="modal-link" href={`https://www.discogs.com/release/${info.id}`} target="_blank" rel="noopener">View on Discogs ↗</a>
                    {BACKEND_API && (
                      <div className="modal-section">
                        <div className="modal-section-label">My notes &amp; price {personalFields[info.id] ? '✓' : ''}</div>
                        <PersonalFieldsForm releaseId={info.id} personal={personalFields[info.id]} onSave={savePersonal} onDelete={deletePersonal} />
                      </div>
                    )}
                  </div>
                </div>
              </div>
            );
          })()}
        </div>
      );
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script data-goatcounter="https://runout.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
